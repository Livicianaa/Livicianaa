name: Update README

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "17 9 * * *"
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Livicianaa/readme-recent-projects@v1
        with:
          skip: "^(ornek-|tanitim-)"
